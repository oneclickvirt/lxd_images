image:
  distribution: fedora
source:
  downloader: fedora-http
  url: https://kojipkgs.fedoraproject.org
targets:
  lxc:
    create_message: |
      You just created a {{ image.description }} container.
    config:
    - type: all
      before: 5
      content: lxc.include = LXC_TEMPLATE_CONFIG/fedora.common.conf
    - type: user
      before: 5
      content: lxc.include = LXC_TEMPLATE_CONFIG/fedora.userns.conf
    - type: all
      after: 4
      content: lxc.include = LXC_TEMPLATE_CONFIG/common.conf
    - type: user
      after: 4
      content: lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
    - type: all
      content: lxc.arch = {{ image.architecture_kernel }}
files:
- path: /etc/default/grub
  generator: dump
  content: |-
    # Set the recordfail timeout
    GRUB_RECORDFAIL_TIMEOUT=0

    # Do not wait on grub prompt
    GRUB_TIMEOUT=0

    # Set the default commandline
    GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} console=tty1 console=ttyS0"

    # Set the grub console type
    GRUB_TERMINAL=console

    # Disable os-prober
    GRUB_DISABLE_OS_PROBER=true
  types:
  - vm
- path: /etc/dracut.conf.d/lxd.conf
  generator: dump
  content: add_drivers+=" virtio_scsi virtio_blk "
  types:
  - vm
- generator: fstab
  types:
  - vm
- path: /etc/machine-id
  generator: dump
- path: /etc/fstab
  generator: dump
  types:
  - container
- path: /var/lib/dbus/machine-id
  generator: remove
- path: /etc/hostname
  generator: hostname
- path: /etc/hosts
  generator: hosts
- name: eth0.network
  path: /etc/systemd/network/eth0.network
  generator: dump
  content: |-
    [Match]
    Name=eth0

    [Network]
    DHCP=ipv4

    [DHCPv4]
    UseDomains=true
    UseMTU=true

    [DHCP]
    ClientIdentifier=mac
  variants:
  - default
  types:
  - container
- name: enp5s0.network
  path: /etc/systemd/network/enp5s0.network
  generator: dump
  content: |-
    [Match]
    Name=enp5s0

    [Network]
    DHCP=ipv4

    [DHCPv4]
    UseDomains=true
    UseMTU=true

    [DHCP]
    ClientIdentifier=mac
  variants:
  - default
  types:
  - vm
- name: meta-data
  generator: cloud-init
  variants:
  - cloud
- name: network-config
  generator: cloud-init
  content: |-
    {% if config_get("user.network-config", "") == "" %}version: 1
    config:
      - type: physical
        name: {% if instance.type == "virtual-machine" %}enp5s0{% else %}eth0{% endif %}
        subnets:
          - type: {% if config_get("user.network_mode", "") == "link-local" %}manual{% else %}dhcp{% endif %}
            control: auto
          - type: dhcp6
            control: auto{% else %}{{ config_get("user.network-config", "") }}{% endif %}
  variants:
  - cloud
- name: user-data
  generator: cloud-init
  variants:
  - cloud
- name: vendor-data
  generator: cloud-init
  variants:
  - cloud
- generator: lxd-agent
  types:
  - vm
packages:
  manager: dnf
  update: true
  cleanup: true
  sets:
  - packages:
    - cpio
    - file
    - findutils
    - fipscheck
    - gettext
    - glibc-all-langpacks
    - hardlink
    - hostname
    - ipcalc
    - iproute
    - iproute-tc
    - iputils
    - kbd
    - kmod
    - openssh-clients
    - passwd
    - pigz
    - policycoreutils
    - procps-ng
    - sudo
    - systemd-udev
    - which
    - xz
    - curl
    - wget
    - bash
    - lsof
    - sshpass
    - openssh-server
    - iptables
    - dos2unix
    - cronie
    action: install
  - packages:
    - cloud-init
    - openssh-server
    action: install
    variants:
    - cloud
  - packages:
    - cloud-utils-growpart
    action: install
    types:
    - vm
    variants:
    - cloud
  - packages:
    - libsss_idmap
    - libsss_nss_idmap
    - sssd-client
    action: remove
  - packages:
    - grub2-efi-x64
    action: install
    architectures:
    - x86_64
    types:
    - vm
  - packages:
    - grub2-efi-aa64
    action: install
    architectures:
    - aarch64
    types:
    - vm
  - packages:
    - kernel
    - shim
    - dracut
    action: install
    types:
    - vm
  - packages:
    - lvm2
    - lvm2-libs
    action: remove
    types:
    - vm
  - packages:
    - libsss_idmap
    - libsss_nss_idmap
    - sssd-client
    action: remove
  - packages:
    - grub2-tools
    - grubby
    action: install
    types:
    - vm
actions:
- trigger: post-unpack
  action: |-
    #!/bin/sh

    set -eux

    # Increase connection timeout
    echo timeout=60 >> /etc/dnf/dnf.conf

    # Let dnf find the fastest mirror
    echo fastestmirror=True >> /etc/dnf/dnf.conf

    # Backup all repo files
    for repo in $(ls /etc/yum.repos.d/*.repo); do
      cp "${repo}" "${repo}.bak"
    done
- trigger: post-unpack
  action: |-
    #!/bin/sh

    set -eux

    # Use Fedora 38 GPG key to avoid package installation errors
    for repo in $(ls /etc/yum.repos.d/*.repo); do
      grep -q 'RPM-GPG-KEY-fedora-38' "${repo}" && continue

      sed -ri 's#^gpgkey=.*#\0 file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-38-$basearch#g' "${repo}"
    done
  architectures:
  - aarch64
  - x86_64
  releases:
  - Rawhide
- trigger: post-unpack
  action: |-
    #!/bin/sh

    set -eux

    # Use baseurl instead of metalink to avoid networking issues
    for repo in $(ls /etc/yum.repos.d/*.repo); do
      grep -q '^#baseurl' "${repo}" || continue

      sed -ri 's/^metalink=.*/#\0/g;s@^#(baseurl=)http://download.example/pub/fedora/linux(.*)@\1https://muug.ca/mirror/fedora-secondary\2@g' "${repo}"
    done
  architectures:
  - ppc64le
  - s390x
- trigger: post-packages
  action: |-
    #!/bin/sh
    umount -l /etc/resolv.conf || true
    rm /etc/resolv.conf
    ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
    systemctl enable systemd-resolved
    cp -R /etc/skel/.bash* /root/
- trigger: post-packages
  action: |-
    #!/bin/sh
    systemctl mask systemd-nsresourced.service systemd-nsresourced.socket
  types:
  - container
  releases:
  - 41
- trigger: post-packages
  action: |-
    #!/bin/sh
    systemctl enable systemd-networkd
- trigger: post-packages
  action: |-
    #!/bin/sh
    systemctl enable cloud-init
    systemctl enable cloud-config
    systemctl enable cloud-final
  variants:
  - cloud
- trigger: post-unpack
  action: |-
    #!/bin/sh
    # Generate machine-id in order for the kernel stuff to be configured properly
    [ -f /etc/machine-id ] || uuidgen > /etc/machine-id
  types:
  - vm
- trigger: post-files
  action: |-
    #!/bin/sh
    set -eux

    # Remove the "Container Image" string as this is going to be am VM
    sed -i 's/[ ]*(Container Image)//;/^VARIANT/d' /etc/os-release

    target=/boot/grub2/grub.cfg
    grub2-mkconfig -o "${target}"
    sed -i "s#root=[^ ]*#root=${LXD_IMAGEBUILDER_ROOT_UUID}#g" "${target}"

    sed -Eri "s#^(linux|initrd) .+/overlay/#\1 /#g" /boot/loader/entries/*
    sed -ri 's#^options .+#options $kernelopts#g' /boot/loader/entries/*

    # Regenerate initramfs
    kver=$(ls /boot/initramfs-*.img | sed -r 's#.*initramfs-(.+)\.img#\1#')
    dracut --kver "${kver}" -f

    # Unmask all masked unit files
    for f in $(find /etc/systemd/system -type l); do
      [ "$(readlink ${f})" = "/dev/null" ] && rm "${f}"
    done

    # Wipe grub environment
    rm -f /boot/efi/EFI/fedora/grubenv

    exit 0
  types:
  - vm
- trigger: post-files
  action: |-
    #!/bin/sh
    set -eux

    # Restore repos
    for repo in $(ls /etc/yum.repos.d/*.bak); do
      mv "${repo}" ${repo%.*}
    done
- trigger: post-files
  action: |-
    #!/bin/sh
    set -eux

    systemctl disable iptables || true
    systemctl enable sshd || true
    systemctl enable ssh || true
    # sshd_config
    sed -i "s/^#\?\(Port\).*/\1 22/" /etc/ssh/sshd_config || true
    sed -i -E 's/^#?(Port).*/\1 22/' /etc/ssh/sshd_config || true
    sed -i 's/^#\?Port.*/Port 22/g' /etc/ssh/sshd_config || true
    sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config || true
    sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/g' /etc/ssh/sshd_config || true
    sed -i 's/#ListenAddress 0.0.0.0/ListenAddress 0.0.0.0/' /etc/ssh/sshd_config || true
    sed -i 's/#ListenAddress ::/ListenAddress ::/' /etc/ssh/sshd_config || true
    sed -i 's/#AddressFamily any/AddressFamily any/' /etc/ssh/sshd_config || true
    sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/g' /etc/ssh/sshd_config || true
    sed -i '/^#UsePAM\\|UsePAM/c #UsePAM no' /etc/ssh/sshd_config || true
    sed -i '/^AuthorizedKeysFile/s/^/#/' /etc/ssh/sshd_config || true
    # cloud-init
    sed -i "s/^#\?\(Port\).*/\1 22/" /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i -E 's/^#?(Port).*/\1 22/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/^#\?Port.*/Port 22/g' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/g' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/#ListenAddress 0.0.0.0/ListenAddress 0.0.0.0/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/#ListenAddress ::/ListenAddress ::/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/#AddressFamily any/AddressFamily any/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/g' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i '/^#UsePAM\\|UsePAM/c #UsePAM no' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i '/^AuthorizedKeysFile/s/^/#/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    # other config
    sed -i.bak '/^SELINUX=/cSELINUX=disabled' /etc/sysconfig/selinux || true
    sed -i.bak '/^SELINUX=/cSELINUX=disabled' /etc/selinux/config || true
    grep -q '^PermitRootLogin yes' /etc/ssh/sshd_config || echo "PermitRootLogin yes" >> /etc/ssh/sshd_config || true
    mkdir -p /etc/modprobe.d/ || true
    echo "install algif_aead /bin/false" > /etc/modprobe.d/disable-algif.conf || true
    echo "Related repo https://github.com/oneclickvirt/lxd_images\n--by https://t.me/spiritlhl" >> /etc/motd || true
    echo "Related repo https://github.com/oneclickvirt/lxd_images\n--by https://t.me/spiritlhl" >> /etc/banner || true
    # ensure package manager database integrity
    if command -v dpkg >/dev/null 2>&1; then
        dpkg --configure -a || true
    fi
    if command -v rpm >/dev/null 2>&1; then
        rpm --rebuilddb || true
    fi
    # clean package manager caches to reduce image size
    if command -v apt-get >/dev/null 2>&1; then
        apt-get clean || true
        rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb || true
    fi
    if command -v dnf >/dev/null 2>&1; then
        dnf clean all || true
        rm -rf /var/cache/dnf/* || true
    elif command -v yum >/dev/null 2>&1; then
        yum clean all || true
        rm -rf /var/cache/yum/* || true
    fi
    if command -v zypper >/dev/null 2>&1; then
        zypper clean -a || true
        rm -rf /var/cache/zypp/* || true
    fi
    if command -v pacman >/dev/null 2>&1; then
        pacman -Sc --noconfirm || true
    fi
    if command -v emerge >/dev/null 2>&1; then
        emerge --depclean || true
        rm -rf /var/db/repos/gentoo/* /var/cache/distfiles/* /var/cache/binpkgs/* || true
    fi
    # clean temporary files and logs
    rm -rf /tmp/* /var/tmp/* || true
    find /var/log -type f \( -name "*.log" -o -name "*.gz" -o -name "*.1" \) -delete 2>/dev/null || true
    truncate -s 0 /var/log/lastlog 2>/dev/null || true
  types:
  - vm
  - container
  variants:
  - cloud
  - default
- trigger: post-packages
  types:
  - vm
  action: |
    #!/bin/sh
    set -eu
    # hosted-rpm-kernel-image
    mkdir -p /boot
    for modules in /usr/lib/modules/* /lib/modules/*; do
      [ -d "$modules" ] || continue
      version=${modules##*/}
      if [ -s "$modules/vmlinuz" ] && [ ! -s "/boot/vmlinuz-$version" ]; then
        cp "$modules/vmlinuz" "/boot/vmlinuz-$version"
      fi
    done
- trigger: post-files
  types:
  - vm
  action: |
    #!/bin/sh
    set -eu
    # hosted-rpm-efi-forwarder
    guest_root=${LXD_IMAGEBUILDER_ROOT_UUID}
    case "$guest_root" in UUID=*) guest_uuid=${guest_root#UUID=};; *) echo 'Expected UUID root device' >&2; exit 1;; esac
    test -n "$guest_uuid"
    mkdir -p /boot/grub2 /boot/loader/entries
    if [ ! -s /boot/grub2/grub.cfg ]; then
      test -s /boot/efi/EFI/fedora/grub.cfg
      cp /boot/efi/EFI/fedora/grub.cfg /boot/grub2/grub.cfg
    fi
    test -s /boot/grub2/grub.cfg
    entries=0
    for entry in /boot/loader/entries/*.conf; do
      [ -f "$entry" ] || continue
      # RPM may record the builder host's mount prefix in a BLS entry.
      # Resolve kernel/initramfs basenames against the guest's actual /boot;
      # the existence gate below still rejects missing or unexpected images.
      awk '
        $1 == "linux" || $1 == "initrd" {
          for (i=2; i<=NF; i++) {
            name=$i; sub(/^.*\//, "", name)
            if (name ~ /^(vmlinuz-|initramfs-)/) $i="/boot/" name
          }
        }
        { print }
      ' "$entry" > "$entry.hosted"
      cat "$entry.hosted" > "$entry"
      rm "$entry.hosted"
      for image_path in $(awk '$1 == "linux" || $1 == "initrd" {for (i=2; i<=NF; i++) print $i}' "$entry"); do
        test -s "$image_path" || { echo "Missing BLS boot image: $image_path" >&2; exit 1; }
      done
      entries=$((entries + 1))
    done
    if grep -q 'blscfg' /boot/grub2/grub.cfg; then
      test "$entries" -gt 0
      if [ ! -s /boot/grub2/grubenv ]; then grub2-editenv /boot/grub2/grubenv create; fi
      grub2-editenv /boot/grub2/grubenv set blsdir=/boot/loader/entries
      grub2-editenv /boot/grub2/grubenv set "kernelopts=root=$guest_root ro console=tty1 console=ttyS0 console=ttyAMA0"
    fi
    for vendor in fedora BOOT; do
      mkdir -p "/boot/efi/EFI/$vendor"
      cat > "/boot/efi/EFI/$vendor/grub.cfg" <<EOF
    search --no-floppy --fs-uuid --set=dev $guest_uuid
    set prefix=(\$dev)/boot/grub2
    export prefix
    configfile \$prefix/grub.cfg
    EOF
    done
- trigger: post-files
  types:
  - vm
  action: |
    #!/bin/sh
    set -eu
    # hosted-rpm-ssh-hostkeys
    mkdir -p /etc/systemd/system/sshd.service.d
    cat > /etc/systemd/system/hosted-ssh-hostkeys.service <<'UNIT'
    [Unit]
    Description=Generate missing SSH host keys before SSH starts
    After=local-fs.target
    Before=sshd.service
    [Service]
    Type=oneshot
    ExecStart=/usr/bin/ssh-keygen -A
    RemainAfterExit=yes
    UNIT
    cat > /etc/systemd/system/sshd.service.d/10-host-keys.conf <<'UNIT'
    [Unit]
    Requires=hosted-ssh-hostkeys.service
    After=hosted-ssh-hostkeys.service
    UNIT
- trigger: post-files
  types:
  - container
  action: |
    #!/bin/sh
    set -eu
    # hosted-consumer-dns-file
    if [ -L /etc/resolv.conf ]; then
      case "$(readlink /etc/resolv.conf)" in
        /run/*|../run/*|/var/run/*|../var/run/*)
          rm /etc/resolv.conf
          touch /etc/resolv.conf
          ;;
      esac
    fi
