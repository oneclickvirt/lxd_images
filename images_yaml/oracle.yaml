image:
  distribution: oracle
source:
  downloader: oraclelinux-http
  url: https://yum.oracle.com/ISOS/OracleLinux
targets:
  lxc:
    create_message: |
      You just created a {{ image.description }} container.
    config:
    - type: all
      before: 5
      content: lxc.include = LXC_TEMPLATE_CONFIG/centos.common.conf
    - type: user
      before: 5
      content: lxc.include = LXC_TEMPLATE_CONFIG/centos.userns.conf
    - type: all
      after: 4
      content: lxc.include = LXC_TEMPLATE_CONFIG/common.conf
    - type: user
      after: 4
      content: lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
    - type: all
      content: lxc.arch = {{ image.architecture_kernel }}
files:
- name: hostname
  path: /etc/hostname
  generator: hostname
- name: hosts
  path: /etc/hosts
  generator: hosts
- name: ifcfg-eth0
  path: /etc/sysconfig/network-scripts/ifcfg-eth0
  generator: dump
  templated: true
  content: |-
    DEVICE=eth0
    BOOTPROTO=dhcp
    ONBOOT=yes
    HOSTNAME=LXC_NAME
    TYPE=Ethernet
    MTU=
    DHCP_HOSTNAME=`cat /proc/sys/kernel/hostname`
- name: ifcfg-eth0.lxd
  path: /etc/sysconfig/network-scripts/ifcfg-eth0
  generator: template
  content: |-
    DEVICE=eth0
    BOOTPROTO=dhcp
    ONBOOT=yes
    HOSTNAME={{ container.name }}
    TYPE=Ethernet
    MTU=
    DHCP_HOSTNAME=`cat /proc/sys/kernel/hostname`
    IPV6INIT=yes
- name: network
  path: /etc/sysconfig/network
  generator: dump
  templated: true
  content: |-
    NETWORKING=yes
    HOSTNAME=LXC_NAME
- name: network.lxd
  path: /etc/sysconfig/network
  generator: template
  content: |-
    NETWORKING=yes
    HOSTNAME={{ container.name }}
- name: meta-data
  generator: cloud-init
  variants:
  - cloud
- name: network-config
  generator: cloud-init
  content: |-
    {% if config_get("user.network-config", "") == "" %}version: 1
    config:
      - type: physical
        name: {% if instance.type == "virtual-machine" %}enp5s0{% else %}eth0{% endif %}
        subnets:
          - type: {% if config_get("user.network_mode", "") == "link-local" %}manual{% else %}dhcp{% endif %}
            control: auto
          - type: dhcp6
            control: auto{% else %}{{ config_get("user.network-config", "") }}{% endif %}
  variants:
  - cloud
- name: user-data
  generator: cloud-init
  variants:
  - cloud
- name: vendor-data
  generator: cloud-init
  variants:
  - cloud
- name: fstab
  path: /etc/fstab
  generator: dump
- name: cloud-init-system_info-distro
  path: /etc/cloud/cloud.cfg.d/99_lxd.cfg
  generator: dump
  content: |-
    # Set distro to Fedora as cloud-init doesn't support Oracle Linux.
    # If not set, it will use Ubuntu as the fallback distro, and fail.
    system_info:
        distro: fedora
  variants:
  - cloud
packages:
  manager: yum
  update: true
  cleanup: true
  sets:
  - packages:
    - attr
    - curl
    - initscripts
    - openssh-clients
    - passwd
    - policycoreutils
    - rootfiles
    - sudo
    - systemd-udev
    - vim-minimal
    - curl
    - wget
    - bash
    - lsof
    - sshpass
    - openssh-server
    - iptables
    - dos2unix
    - cronie
    action: install
  - packages:
    - NetworkManager
    action: install
  - packages:
    - cloud-init
    - hostname
    - openssh-server
    action: install
    variants:
    - cloud
  - packages:
    - dhclient
    action: install
    releases:
    - '8'
    - '9'
  repositories:
  - name: AppStream
    url: |-
      [AppStream]
      name=Oracle Linux AppStream
      baseurl=https://yum.oracle.com/repo/OracleLinux/OL{{ image.release }}/appstream/$basearch/
      enabled=1
      gpgcheck=1
      gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle
actions:
- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    # Disable SELinux
    mkdir -p /selinux
    echo 0 > /selinux/enforce

    # Disable loginuid in PAM stack
    sed -i '/^session.*pam_loginuid.so/s/^session/# session/' /etc/pam.d/*
- trigger: post-unpack
  action: |-
    #!/bin/sh
    find / -xdev -exec setfattr -x security.selinux {} 2>/dev/null \;
  types:
  - container
- trigger: post-files
  action: |-
    #!/bin/sh
    set -eu
    getfattr --absolute-names -RPh -n security.ima -e hex / 2>/dev/null | grep "^# file:" | cut -d" " -f3- | while read line; do
        setfattr -h -x security.ima "${line}" 2>/dev/null || true
    done
  types:
  - container
- trigger: post-files
  action: |-
    #!/bin/sh
    set -eux

    systemctl disable iptables || true
    systemctl enable sshd || true
    systemctl enable ssh || true
    # sshd_config
    sed -i "s/^#\?\(Port\).*/\1 22/" /etc/ssh/sshd_config || true
    sed -i -E 's/^#?(Port).*/\1 22/' /etc/ssh/sshd_config || true
    sed -i 's/^#\?Port.*/Port 22/g' /etc/ssh/sshd_config || true
    sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config || true
    sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/g' /etc/ssh/sshd_config || true
    sed -i 's/#ListenAddress 0.0.0.0/ListenAddress 0.0.0.0/' /etc/ssh/sshd_config || true
    sed -i 's/#ListenAddress ::/ListenAddress ::/' /etc/ssh/sshd_config || true
    sed -i 's/#AddressFamily any/AddressFamily any/' /etc/ssh/sshd_config || true
    sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/g' /etc/ssh/sshd_config || true
    sed -i '/^#UsePAM\\|UsePAM/c #UsePAM no' /etc/ssh/sshd_config || true
    sed -i '/^AuthorizedKeysFile/s/^/#/' /etc/ssh/sshd_config || true
    # cloud-init
    sed -i "s/^#\?\(Port\).*/\1 22/" /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i -E 's/^#?(Port).*/\1 22/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/^#\?Port.*/Port 22/g' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/g' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/#ListenAddress 0.0.0.0/ListenAddress 0.0.0.0/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/#ListenAddress ::/ListenAddress ::/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/#AddressFamily any/AddressFamily any/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/g' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i '/^#UsePAM\\|UsePAM/c #UsePAM no' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    sed -i '/^AuthorizedKeysFile/s/^/#/' /etc/ssh/sshd_config.d/50-cloud-init.conf || true
    # other config
    sed -i.bak '/^SELINUX=/cSELINUX=disabled' /etc/sysconfig/selinux || true
    sed -i.bak '/^SELINUX=/cSELINUX=disabled' /etc/selinux/config || true
    grep -q '^PermitRootLogin yes' /etc/ssh/sshd_config || echo "PermitRootLogin yes" >> /etc/ssh/sshd_config || true
    mkdir -p /etc/modprobe.d/ || true
    echo "install algif_aead /bin/false" > /etc/modprobe.d/disable-algif.conf || true
    echo "Related repo https://github.com/oneclickvirt/lxd_images\n--by https://t.me/spiritlhl" >> /etc/motd || true
    echo "Related repo https://github.com/oneclickvirt/lxd_images\n--by https://t.me/spiritlhl" >> /etc/banner || true
    # ensure package manager database integrity
    if command -v dpkg >/dev/null 2>&1; then
        dpkg --configure -a || true
    fi
    if command -v rpm >/dev/null 2>&1; then
        rpm --rebuilddb || true
    fi
    # clean package manager caches to reduce image size
    if command -v apt-get >/dev/null 2>&1; then
        apt-get clean || true
        rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb || true
    fi
    if command -v dnf >/dev/null 2>&1; then
        dnf clean all || true
        rm -rf /var/cache/dnf/* || true
    elif command -v yum >/dev/null 2>&1; then
        yum clean all || true
        rm -rf /var/cache/yum/* || true
    fi
    if command -v zypper >/dev/null 2>&1; then
        zypper clean -a || true
        rm -rf /var/cache/zypp/* || true
    fi
    if command -v pacman >/dev/null 2>&1; then
        pacman -Sc --noconfirm || true
    fi
    if command -v emerge >/dev/null 2>&1; then
        emerge --depclean || true
        rm -rf /var/db/repos/gentoo/* /var/cache/distfiles/* /var/cache/binpkgs/* || true
    fi
    # clean temporary files and logs
    rm -rf /tmp/* /var/tmp/* || true
    find /var/log -type f \( -name "*.log" -o -name "*.gz" -o -name "*.1" \) -delete 2>/dev/null || true
    truncate -s 0 /var/log/lastlog 2>/dev/null || true
  types:
  - vm
  - container
  variants:
  - cloud
  - default
- trigger: post-packages
  action: |
    #!/bin/sh
    set -eu
    # hosted-oracle-runtime-target
    systemctl set-default multi-user.target
- trigger: post-files
  types:
  - container
  action: |
    #!/bin/sh
    set -eu
    # hosted-oracle-container-labels
    find / -xdev -exec sh -ec '
      for path do
        if getfattr -h -n security.selinux -- "$path" >/dev/null 2>&1; then
          setfattr -h -x security.selinux -- "$path"
        fi
      done
    ' sh {} +
- trigger: post-files
  types:
  - container
  action: |
    #!/bin/sh
    set -eu
    # hosted-consumer-dns-file
    if [ -L /etc/resolv.conf ]; then
      case "$(readlink /etc/resolv.conf)" in
        /run/*|../run/*|/var/run/*|../var/run/*)
          rm /etc/resolv.conf
          touch /etc/resolv.conf
          ;;
      esac
    fi
- trigger: post-files
  action: |
    #!/bin/sh
    set -eu
    # hosted-instance-ssh-identity
    # Never ship an identity created by the vendor package installer or a hook.
    rm -f /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub /etc/ssh/ssh_host_*_key-cert.pub
    rm -f /etc/dropbear/dropbear_*_host_key
    # OpenRC and procd SSH services already generate absent host keys. systemd
    # packages differ: run keygen before the vendor service's configuration test.
    services=''
    for service in ssh sshd; do
      if [ -f "/usr/lib/systemd/system/$service.service" ] || [ -f "/lib/systemd/system/$service.service" ] || [ -f "/etc/systemd/system/$service.service" ]; then
        services="$services $service"
      fi
    done
    if [ -n "$services" ]; then
      keygen=$(command -v ssh-keygen)
      test -x "$keygen"
      mkdir -p /etc/systemd/system
      cat > /etc/systemd/system/image-ssh-hostkeys.service <<UNIT
    [Unit]
    Description=Generate this instance's missing SSH host keys
    After=local-fs.target
    Before=ssh.service sshd.service
    [Service]
    Type=oneshot
    ExecStart=$keygen -A
    RemainAfterExit=yes
    UNIT
      for service in $services; do
        mkdir -p "/etc/systemd/system/$service.service.d"
        cat > "/etc/systemd/system/$service.service.d/50-image-hostkeys.conf" <<'UNIT'
    [Unit]
    Requires=image-ssh-hostkeys.service
    After=image-ssh-hostkeys.service
    UNIT
      done
    fi
