name: LXD Simplestreams Pre Build
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: processed-image-refresh
      cancel-in-progress: false
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/lxd_images/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/lxd_images/main/.github/scripts/release_assets.py" -o "$RUNNER_TEMP/ci-release-assets.py"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Validate and replace complete image pairs
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/process_images.py --metadata lxd
    timeout-minutes: 360
    # Each producer job publishes only after its image passes validation.
    # A different failed matrix entry must not delay these verified updates.
    if: github.event_name != 'workflow_run' || contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
'on':
  schedule:
  - cron: 0 18 * * *
  workflow_dispatch: null
  workflow_run:
    workflows:
    - Hosted image build and boot validation
    - Replace inherited SSH identities in published container images
    types:
    - completed
    branches:
    - main
permissions:
  contents: write
