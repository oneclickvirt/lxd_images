name: Run LXD Tests
'on':
  schedule:
  - cron: 0 4 2-30/2 * *
  workflow_dispatch:
    inputs:
      scope:
        description: Published image coverage
        type: choice
        options:
        - smoke
        - full
        default: smoke
      image:
        description: Exact published asset; empty selects the suite
        type: string
        default: ''
permissions:
  contents: read
jobs:
  validate-published:
    uses: ./.github/workflows/hosted-tests.yml
    with:
      scope: ${{ inputs.scope || 'smoke' }}
      image: ${{ inputs.image || '' }}
      kind: container
