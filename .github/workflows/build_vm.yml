name: Multi-Distro KVM Images Builder
'on':
  workflow_dispatch:
    inputs:
      distro:
        description: Distribution to rebuild
        type: choice
        required: true
        default: debian
        options:
        - debian
        - ubuntu
        - fedora
        - opensuse
        - alpine
        - archlinux
        - centos
        - almalinux
        - rockylinux
        - openwrt
        - gentoo
        - openeuler
      release:
        description: Exact configured release or code name
        type: string
        required: true
        default: trixie
      arch:
        description: Runner architecture
        type: choice
        required: true
        default: amd64
        options:
        - amd64
        - arm64
permissions:
  contents: write
jobs:
  validated-build:
    uses: ./.github/workflows/hosted-build.yml
    with:
      distro: ${{ inputs.distro }}
      arch: all
      kind: vm
      scope: current
      release: ${{ inputs.release || '' }}
