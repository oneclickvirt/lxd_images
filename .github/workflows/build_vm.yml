name: Multi-Distro KVM Images Builder
jobs:
  build-lxd-kvm-images:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        distro:
        - debian
        - ubuntu
        - fedora
        - opensuse
        - alpine
        - archlinux
        - centos
        - almalinux
        - rockylinux
        - oracle
        - openwrt
        - gentoo
        - openeuler
        arch:
        - name: amd64
          runner: ubuntu-latest
        - name: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 360
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/lxd_images/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/lxd_images/main/.github/scripts/release_assets.py" -o "$RUNNER_TEMP/ci-release-assets.py"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check workspace
      run: pwd
    - name: Build environment
      run: |
        sudo apt update -y
        sudo apt install -y polkit || sudo apt install -y policykit-1
        sudo apt install -y jq btrfs-progs dosfstools qemu-kvm
    - name: Configure Git Identity
      run: |
        git config --global user.name "lxd-kvm-builder"
        git config --global user.email "tg@spiritlhl.top"
    - name: Install GitHub CLI
      run: |
        sudo apt install -y gh
    - name: Build and Upload LXD KVM Images
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ github.token }}
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        set -euo pipefail
        DISTRO="${{ matrix.distro }}"
        ARCH="${{ matrix.arch.name }}"
        distros=("$DISTRO")
        for distro in "${distros[@]}"; do
          output=$(bash build_kvm_images.sh "$distro" false "$ARCH" | tail -n 1)
          read -r -a assets <<< "$output"
          [[ ${#assets[@]} -gt 0 ]] || { echo "No configured image outputs." >&2; exit 1; }
          sudo bash -c 'source "$1"; export -f ci_retry gh git ci_clone_attempt curl wget; bash "$2" "$3" true "$4"' -- "$RUNNER_TEMP/ci-network.sh" "build_kvm_images.sh" "$distro" "$ARCH"
          for file in "${assets[@]}"; do
            [[ "$file" =~ ^[A-Za-z0-9_.-]+\.zip$ ]] || { echo "Invalid output filename." >&2; exit 1; }
            [[ -f "$file" ]] || { echo "Expected image was not built: $file" >&2; exit 1; }
            size=$(stat -c %s "$file")
            (( size > 10485760 && size <= 2147483648 )) || { echo "Image size is outside release limits: $file" >&2; exit 1; }
            python3 -m zipfile -t "$file"
          done
          python3 "$RUNNER_TEMP/ci-release-assets.py" kvm_images "${assets[@]}"
          sudo rm -f "${assets[@]}"
        done
      shell: bash
'on':
  schedule:
  - cron: 0 20 * * *
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: image-publish-build_vm
  cancel-in-progress: false
