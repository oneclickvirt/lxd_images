name: Build LXD Simplestreams
jobs:
  build-simplestreams:
    runs-on: ubuntu-latest
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/lxd_images/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/lxd_images/main/.github/scripts/release_assets.py" -o "$RUNNER_TEMP/ci-release-assets.py"
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip snapd wget
        sudo pip install PyYAML
        for i in 1 2 3; do
          sudo snap install lxd-imagebuilder --classic --edge && break
          echo "Retrying snap install... ($i)"
          sleep 15
        done
        lxd-imagebuilder --version
    - name: Install simplestream-maintainer
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        sudo apt-get update
        sudo apt-get install -y golang git
        git clone https://github.com/oneclickvirt/lxd-imagebuilder.git
        cd lxd-imagebuilder/simplestream-maintainer
        go build -o simplestream-maintainer .
        sudo mv simplestream-maintainer /usr/local/bin/
        simplestream-maintainer --version
        simplestream-maintainer build -h
      shell: bash
    - name: Download assets from GitHub Release
      run: python3 .github/scripts/download_processed.py --metadata lxd
    - name: Generate SHA256SUMS for images
      run: |
        find build/spiritlhl -type d | while read d; do
          cd "$d"
          files=""
          for f in rootfs.squashfs lxd.tar.xz; do
            if [ -f "$f" ]; then
              files="$files $f"
            fi
          done
          if [ -n "$files" ]; then
            sha256sum $files > SHA256SUMS
            echo "Generated SHA256SUMS in $d"
          fi
          cd - >/dev/null
        done
    - name: Build simplestreams index and webpage
      run: |
        ls
        simplestream-maintainer build build --build-webpage -d spiritlhl
    - name: Patch index.html for spiritlhl (content-only)
      run: |
        find build -name "index.html" | while read -r f; do
          sed -i 's/images:/spiritlhl:/g' "$f"
          echo "Patched $f"
        done
    - name: List build contents
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        wget https://raw.githubusercontent.com/oneclickvirt/lxd_images/refs/heads/main/back/google9217a97bfdec3a8f.html -O ./build/google9217a97bfdec3a8f.html
        chmod 777 ./build/google9217a97bfdec3a8f.html
        echo "Build directory contents:"
        find build -type f | head -30
      shell: bash
    - name: Deploy to Netlify
      uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
      with:
        publish-dir: ./build
        production-branch: main
        github-token: ${{ secrets.GITHUB_TOKEN }}
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
'on':
  workflow_dispatch: null
  schedule:
  - cron: 0 5 * * *
