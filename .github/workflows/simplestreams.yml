name: Build LXD Simplestreams
jobs:
  build-simplestreams:
    runs-on: ubuntu-24.04
    # Skipped upstream events must not replace a waiting real deployment.
    concurrency:
      group: image-portal-deploy
      cancel-in-progress: false
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/lxd_images/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/lxd_images/main/.github/scripts/release_assets.py" -o "$RUNNER_TEMP/ci-release-assets.py"
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: |-
        source "$RUNNER_TEMP/ci-network.sh"
        ci_retry sudo apt-get update -y
        ci_retry sudo apt-get install -y --no-install-recommends python3 xdelta3 wget
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'
        cache: false
        check-latest: true
    - name: Install simplestream-maintainer
      run: bash .github/scripts/install_stream_maintainer.sh lxd
      shell: bash
    - name: Download assets from GitHub Release
      run: python3 .github/scripts/download_processed.py --metadata lxd
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Generate SHA256SUMS for images
      run: |
        find build/spiritlhl -type d | while read d; do
          cd "$d"
          files=""
          for f in rootfs.squashfs lxd.tar.xz; do
            if [ -f "$f" ]; then
              files="$files $f"
            fi
          done
          if [ -n "$files" ]; then
            sha256sum $files > SHA256SUMS
            echo "Generated SHA256SUMS in $d"
          fi
          cd - >/dev/null
        done
    - name: Build simplestreams index and webpage
      run: |
        ls
        simplestream-maintainer build build --build-webpage -d spiritlhl
    - name: Validate image index and apply maintained portal layout
      run: python3 .github/scripts/style_image_portal.py --root build --flavour lxd
    - name: List build contents
      run: |
        install -m 0644 back/google9217a97bfdec3a8f.html ./build/google9217a97bfdec3a8f.html
        echo "Build directory contents:"
        find build -type f | sed -n '1,30p'
      shell: bash
    - name: Require Netlify publication credentials
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      run: test -n "$NETLIFY_AUTH_TOKEN" && test -n "$NETLIFY_SITE_ID"
    - name: Deploy to Netlify
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if npm exec --yes --package=netlify-cli@27.12.1 -- netlify deploy \
              --dir ./build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
              --message "${GITHUB_REPOSITORY}@${GITHUB_SHA}"; then
            exit 0
          fi
          if [[ "$attempt" -lt 3 ]]; then
            echo "Netlify deploy attempt $attempt failed; retrying after a short delay." >&2
            sleep "$((attempt * 10))"
          fi
        done
        echo "Netlify deployment failed after 3 attempts; the existing production site remains active." >&2
        exit 1
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      timeout-minutes: 20
    - name: Verify the published Simplestreams source with the native LXD client
      shell: bash
      run: bash .github/scripts/verify_image_remote.sh lxd
    timeout-minutes: 90
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
'on':
  workflow_dispatch: null
  schedule:
  - cron: 0 5 * * *
  push:
    branches:
    - main
    paths:
    - .github/scripts/style_image_portal.py
    - .github/scripts/validate_image_remote.py
    - .github/scripts/verify_image_remote.sh
    - .github/scripts/install_stream_maintainer.sh
    - .github/scripts/download_processed.py
    - .github/workflows/simplestreams.yml
    - back/google9217a97bfdec3a8f.html
  workflow_run:
    workflows:
    - LXD Simplestreams Pre Build
    types:
    - completed
    branches:
    - main
permissions:
  contents: read
