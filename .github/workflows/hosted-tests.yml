name: Hosted published image tests
'on':
  workflow_dispatch:
    inputs:
      scope:
        description: Published image coverage
        type: choice
        options:
        - smoke
        - full
        default: smoke
      image:
        description: Exact asset filename; empty selects the suite
        type: string
        default: ''
      kind:
        description: Published image type
        type: choice
        options:
        - container
        - vm
        default: container
  schedule:
  - cron: 27 3 * * 1
  workflow_call:
    inputs:
      scope:
        type: string
        default: smoke
      image:
        type: string
        default: ''
      kind:
        type: string
        default: container
permissions:
  contents: read
concurrency:
  group: hosted-published-image-tests-${{ inputs.kind || 'container' }}-${{ inputs.image
    || inputs.scope || 'smoke' }}
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      count: ${{ steps.catalog.outputs.count }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - id: catalog
      env:
        CI_IMAGE_AUTOMATIC: ${{ github.event_name == 'schedule' }}
        GH_TOKEN: ${{ github.token }}
        SCOPE: ${{ inputs.scope || 'smoke' }}
        IMAGE: ${{ inputs.image }}
        KIND: ${{ inputs.kind || 'container' }}
      run: python3 .github/scripts/published_image_suite.py matrix --scope "$SCOPE"
        --kind "$KIND"
  test:
    needs: catalog
    if: needs.catalog.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Prepare disposable runtime
      env:
        KIND: ${{ inputs.kind || 'container' }}
      run: bash .github/scripts/prepare_hosted_runtime.sh lxd
    - name: Download verified published asset
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ matrix.image }}
        TAG: ${{ matrix.tag }}
      run: python3 .github/scripts/published_image_suite.py download
    - name: Validate guest boot, SSH, network and restart
      env:
        IMAGE: ${{ matrix.image }}
      run: python3 .github/scripts/hosted_image_test.py --file "$IMAGE" --runtime
        lxd
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
